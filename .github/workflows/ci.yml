name: Simple Sigh CI

# Game assemblies are never committed. The mod is compiled against the public
# reference-only package Krafs.Rimworld.Ref (signatures, no game code). The
# smoke test that loads real game assemblies, and every in-game check, remain local.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simple-sigh-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: XML and structure tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run XML and structure tests
        run: python -m unittest discover -s Tests/StructureTests -v
      - name: Explain reference-only checks
        run: |
          echo 'Note: RimWorld Core cross-reference tests are skipped without RIMWORLD_REFERENCE_DIR.'
          echo 'These checks do not build the mod or execute RimWorld.'

  unit-tests:
    name: .NET 10 text and layout tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run xUnit tests (no game DLLs required)
        run: dotnet test Tests/SimpleSigh.Text.Tests/SimpleSigh.Text.Tests.csproj --configuration Release --nologo --verbosity normal

  mod-build:
    name: Build SimpleSigh.dll against 1.7 reference assemblies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Krafs.Rimworld.Ref contains signatures only (no game code). The pinned version is the
      # same 1.7 build as the private reference ZIP; the Release build is deterministic.
      - name: Build Release DLL (warnings are errors)
        run: dotnet build Source/SimpleSigh.csproj --configuration Release --nologo -warnaserror
      - name: Require the committed DLL to match the source
        shell: bash
        run: |
          if ! git diff --quiet -- 1.7/Assemblies/SimpleSigh.dll; then
            echo '::error::1.7/Assemblies/SimpleSigh.dll does not match a Release build of Source/. Rebuild it (tools/verify.sh) and commit it with the source change.'
            exit 1
          fi
      - name: Compile check against the newest 1.7 reference assemblies
        run: dotnet build Source/SimpleSigh.csproj --configuration Release --nologo -warnaserror -p:RimRefVersion=1.7.4985-unstable -p:OutputPath=$RUNNER_TEMP/latest-ref/

  packaging:
    name: Install-ready ZIP packaging
    needs: [structure, unit-tests, mod-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify runtime-only packaging
        run: python -m unittest discover -s Tests/PackagingTests -v
      - name: Create preview ZIP containing only mod files
        run: python tools/package_release.py --version v0.0.0-pr --output dist/SimpleSigh-pr.zip
      - name: Upload install-ready preview ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/SimpleSigh-pr.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
